[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "governor"
version = "0.1.0"
description = "Governor: a minimal, modular agent harness for Bedrock, Anthropic and OpenAI models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3[crt]>=1.40",  # Converse API, AWS_BEARER_TOKEN_BEDROCK, and `aws login` credentials (crt)
    "pyyaml>=6.0",
    "anthropic[bedrock]>=1.0",  # anthropic and mantle providers
    "openai>=3.0",  # openai provider
    "textual>=8.0",  # full-screen terminal UI
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pydantic>=2.0",  # imported by tests/test_governor/test_api_providers.py
]

[project.scripts]
govern = "governor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core", "src/governor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
